<!DOCTYPE html>
<html lang="en">
  <head>
      <title>Example for CSS Container Queries</title>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" type="text/css" href="container-queries.css">
  </head>
  <body>

    <h1>Example for CSS Container Queries</h1>

    <div class="the-container">

      <div class="flex-container">

        <h2>The Container</h2>

        <p class="mode_column">
          The child items in the Flex container are aligned in a <strong>column</strong>,
          because the container's width is less than <code>60ch</code>.
        </p>

        <p class="mode_row">
          The child items in the Flex container are aligned in a <strong>row</strong>,
          because the container's current width is greater than <code>60ch</code>.
        </p>

      </div>

    </div>

  </body>
</html>
